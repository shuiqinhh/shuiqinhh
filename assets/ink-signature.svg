<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="ink-name ink-description">
<title id="ink-name">shuiqinhh</title>
<desc id="ink-description">A brush-written signature, slowly appearing in warm ink on quiet rice paper.</desc>
<defs>
  <filter id="ink-grain" x="-5%" y="-15%" width="110%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".12 .16" numOctaves="3" seed="8" result="noise"/>
    <feColorMatrix in="noise" type="luminanceToAlpha" result="texture"/>
    <feComponentTransfer in="texture" result="dry"><feFuncA type="linear" slope=".65" intercept=".48"/></feComponentTransfer>
    <feComposite in="SourceGraphic" in2="dry" operator="in"/>
  </filter>
  <filter id="ink-mist"><feGaussianBlur stdDeviation="25"/></filter>
  <filter id="ink-paper"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<style>
.ink-glyph{fill:#313934;clip-path:inset(0 0 0 0)}
.ink-signature{animation:ink-rest 22s ease-in-out infinite}
.ink-wash{animation:ink-breathe 26s ease-in-out infinite;transform-origin:450px 165px}
@keyframes ink-rest{0%,2%{opacity:0}5%,83%{opacity:1}96%,100%{opacity:0}}
@keyframes ink-breathe{0%,100%{opacity:.45;transform:translate(0,0)}50%{opacity:.85;transform:translate(-16px,6px)}}
.ink-letter-0{animation:ink-write-0 22s linear infinite}
@keyframes ink-write-0{0%,5.0%{clip-path:inset(0 100% 0 0)}9.0%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-1{animation:ink-write-1 22s linear infinite}
@keyframes ink-write-1{0%,7.8%{clip-path:inset(0 100% 0 0)}11.8%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-2{animation:ink-write-2 22s linear infinite}
@keyframes ink-write-2{0%,10.6%{clip-path:inset(0 100% 0 0)}14.6%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-3{animation:ink-write-3 22s linear infinite}
@keyframes ink-write-3{0%,13.4%{clip-path:inset(0 100% 0 0)}17.4%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-4{animation:ink-write-4 22s linear infinite}
@keyframes ink-write-4{0%,16.2%{clip-path:inset(0 100% 0 0)}20.2%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-5{animation:ink-write-5 22s linear infinite}
@keyframes ink-write-5{0%,19.0%{clip-path:inset(0 100% 0 0)}23.0%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-6{animation:ink-write-6 22s linear infinite}
@keyframes ink-write-6{0%,21.8%{clip-path:inset(0 100% 0 0)}25.8%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-7{animation:ink-write-7 22s linear infinite}
@keyframes ink-write-7{0%,24.6%{clip-path:inset(0 100% 0 0)}28.6%,100%{clip-path:inset(0 0 0 0)}}
.ink-letter-8{animation:ink-write-8 22s linear infinite}
@keyframes ink-write-8{0%,27.4%{clip-path:inset(0 100% 0 0)}31.4%,100%{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.ink-glyph,.ink-signature,.ink-wash{animation:none!important;clip-path:none;opacity:1}.ink-wash{transform:none;opacity:.6}}
</style>
