name: Refresh ink profile

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-ink.py
      - assets/ink-signature.svg
      - .github/workflows/ink-profile.yml

permissions:
  contents: write

concurrency:
  group: ink-profile
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Draw the public contribution calendar
        run: python scripts/update-ink.py --username "${{ github.repository_owner }}"
      - name: Keep the ink current
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ink-commits.svg assets/ink-profile.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update ink contribution calendar"
            git push
          fi
